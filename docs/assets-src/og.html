<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Yolo Learn — og image source</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body { background: #06090f; }
      .card {
        width: 1200px;
        height: 630px;
        padding: 72px 76px;
        background:
          radial-gradient(900px 500px at 92% -12%, rgba(123, 212, 10, 0.18), transparent 62%),
          linear-gradient(160deg, #0b1220 0%, #101b2b 100%);
        color: #e8edf5;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(rgba(255, 255, 255, 0.028) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.028) 1px, transparent 1px);
        background-size: 48px 48px;
      }
      .top, .bottom { position: relative; }
      .brand { display: flex; align-items: center; gap: 16px; }
      .brand .name { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
      .brand .name span { color: #7c8798; font-weight: 500; }
      .eyebrow {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 16px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #7bd40a;
        margin: 44px 0 18px;
      }
      h1 {
        font-size: 62px;
        line-height: 1.06;
        letter-spacing: -0.032em;
        max-width: 21ch;
        font-weight: 700;
      }
      h1 em { font-style: normal; color: #7bd40a; }
      .lead { font-size: 23px; color: #9aa7bd; max-width: 44ch; margin-top: 22px; line-height: 1.45; }
      .bottom { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
      .chips { display: flex; gap: 10px; flex-wrap: wrap; }
      .chip {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 16px;
        padding: 8px 15px;
        border-radius: 999px;
        border: 1px solid #2b3a52;
        color: #b6c2d6;
        background: rgba(255, 255, 255, 0.02);
      }
      .chip.on { border-color: #7bd40a; color: #0b1220; background: #7bd40a; font-weight: 700; }
      .url {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 17px;
        color: #7c8798;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="card" id="og">
      <div class="grid"></div>
      <div class="top">
        <div class="brand">
          <svg width="54" height="54" viewBox="0 0 32 32" fill="none">
            <rect width="32" height="32" rx="8" fill="#0B1220" stroke="#2B3A52" />
            <path d="M22.5 12.2A8 8 0 1 0 24 16.6" stroke="#F4F6F9" stroke-width="2.5" stroke-linecap="round" />
            <path
              d="M10.8 16.3l3.4 3.4 6.6-7"
              stroke="#7BD40A"
              stroke-width="3.1"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle cx="23.2" cy="9.4" r="2.3" fill="#7BD40A" />
          </svg>
          <div class="name">Yolo <span>Learn</span></div>
        </div>
        <p class="eyebrow">OpenAI WebMCP Challenge</p>
        <h1>It learns a website by itself, and <em>heals</em> when the site changes.</h1>
        <p class="lead">
          Reads the page, mints a WebMCP tool mid-session, and survives the redesign with one question.
        </p>
      </div>
      <div class="bottom">
        <div class="chips">
          <span class="chip on">no demonstration</span>
          <span class="chip">deterministic healing</span>
          <span class="chip">you approve every submit</span>
        </div>
        <div class="url">yolo-learn.vercel.app</div>
      </div>
    </div>
  </body>
</html>
