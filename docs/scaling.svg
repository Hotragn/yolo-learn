<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 812" width="1260" height="812" role="img" aria-label="How Yolo Learn reaches a new site, and how it handles multi-page and multi-flow sites">
  <title>Yolo Learn: reaching a new site</title>
  <desc>Three delivery shapes for getting Yolo Learn onto a page it does not own: same-origin demo, a site-adopted SDK, and a browser extension content script. Below, the data model changes needed for flows that span multiple pages, and the storage model for many flows across many origins.</desc>

  <defs>
    <style>
      .t { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .m { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .h { font-size: 15px; font-weight: 600; }
      .s { font-size: 11.5px; }
      .cap { font-size: 12px; font-weight: 700; letter-spacing: 1.3px; }
    </style>
    <marker id="s-lime" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1L9 5L0 9z" fill="#7BD40A"/>
    </marker>
    <marker id="s-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1L9 5L0 9z" fill="#6B7075"/>
    </marker>
  </defs>

  <rect width="1260" height="812" rx="16" fill="#08090A"/>

  <text class="t" x="44" y="52" fill="#F7F8F8" font-size="26" font-weight="500" letter-spacing="-0.5">Reaching a site it does not own</text>
  <text class="t" x="44" y="78" fill="#9B9FA4" font-size="14">WebMCP tools belong to a document. So the only question that matters is: whose code runs in that document?</text>

  <!-- ================= THREE DELIVERY SHAPES ================= -->
  <text class="t cap" x="44" y="118" fill="#6B7075">DELIVERY</text>

  <!-- A: same origin -->
  <rect x="44" y="132" width="356" height="196" rx="12" fill="#111213" stroke="#232527"/>
  <rect x="44" y="132" width="356" height="4" rx="2" fill="#6B7075"/>
  <text class="m s" x="66" y="160" fill="#6B7075">A</text>
  <text class="t h" x="66" y="182" fill="#F7F8F8">Same origin</text>
  <text class="t s" x="66" y="202" fill="#7BD40A">shipped today, this repo</text>
  <text class="t s" x="66" y="228" fill="#9B9FA4">The app and the clinic are one</text>
  <text class="t s" x="66" y="245" fill="#9B9FA4">document, so discovery just works.</text>
  <text class="t s" x="66" y="272" fill="#F2938C">Cannot reach any other site.</text>
  <text class="t s" x="66" y="289" fill="#5F646A">Proves the mechanism, not the</text>
  <text class="t s" x="66" y="306" fill="#5F646A">product.</text>

  <!-- B: site SDK -->
  <rect x="420" y="132" width="356" height="196" rx="12" fill="#111213" stroke="#232527"/>
  <rect x="420" y="132" width="356" height="4" rx="2" fill="#6B7075"/>
  <text class="m s" x="442" y="160" fill="#6B7075">B</text>
  <text class="t h" x="442" y="182" fill="#F7F8F8">Site adopts a script</text>
  <text class="m s" x="442" y="202" fill="#9B9FA4">&lt;script src="yolo-learn.js"&gt;</text>
  <text class="t s" x="442" y="228" fill="#9B9FA4">Runs in the site's own document.</text>
  <text class="t s" x="442" y="245" fill="#9B9FA4">No permissions needed at all.</text>
  <text class="t s" x="442" y="272" fill="#F2938C">Needs the site to cooperate,</text>
  <text class="t s" x="442" y="289" fill="#F2938C">which is the long-tail problem</text>
  <text class="t s" x="442" y="306" fill="#F2938C">this exists to solve.</text>

  <!-- C: extension -->
  <rect x="796" y="132" width="420" height="196" rx="12" fill="#0F1A0B" stroke="#3D5C1F"/>
  <rect x="796" y="132" width="420" height="4" rx="2" fill="#7BD40A"/>
  <text class="m s" x="818" y="160" fill="#A8E85C">C</text>
  <text class="t h" x="818" y="182" fill="#F7F8F8">Extension content script</text>
  <text class="t s" x="818" y="202" fill="#A8E85C">the real product shape</text>
  <text class="t s" x="818" y="228" fill="#9B9FA4">Runs in every page's document, so</text>
  <text class="m s" x="818" y="245" fill="#93A87A">discover.ts</text>
  <text class="t s" x="893" y="245" fill="#9B9FA4">runs unchanged: it only</text>
  <text class="t s" x="818" y="262" fill="#9B9FA4">ever touches the document.</text>
  <text class="t s" x="818" y="289" fill="#F7F8F8">Only shape that reaches the long tail.</text>
  <text class="m s" x="818" y="306" fill="#93A87A">chrome.storage keyed by origin</text>

  <path d="M400 230 L418 230" stroke="#6B7075" stroke-width="2" marker-end="url(#s-grey)"/>
  <path d="M776 230 L794 230" stroke="#7BD40A" stroke-width="2" marker-end="url(#s-lime)"/>

  <!-- ================= MULTI-PAGE ================= -->
  <text class="t cap" x="44" y="382" fill="#6B7075">MANY PAGES IN ONE FLOW</text>
  <text class="t" x="44" y="404" fill="#9B9FA4" font-size="13">A navigation destroys all JavaScript state, so the run has to survive it.</text>

  <!-- route chain -->
  <g>
    <rect x="44" y="424" width="176" height="46" rx="8" fill="#17191A" stroke="#2B2E31"/>
    <text class="m s" x="60" y="444" fill="#F7F8F8">/search</text>
    <text class="t s" x="60" y="461" fill="#9B9FA4">choose service</text>

    <rect x="240" y="424" width="176" height="46" rx="8" fill="#17191A" stroke="#2B2E31"/>
    <text class="m s" x="256" y="444" fill="#F7F8F8">/slots?d=</text>
    <text class="t s" x="256" y="461" fill="#9B9FA4">pick date and time</text>

    <rect x="436" y="424" width="176" height="46" rx="8" fill="#17191A" stroke="#2B2E31"/>
    <text class="m s" x="452" y="444" fill="#F7F8F8">/patient</text>
    <text class="t s" x="452" y="461" fill="#9B9FA4">enter details</text>

    <rect x="632" y="424" width="176" height="46" rx="8" fill="#2A2113" stroke="#6B5426"/>
    <text class="m s" x="648" y="444" fill="#F0BF6B">/checkout</text>
    <text class="t s" x="648" y="461" fill="#C9A468">irreversible: gate here</text>

    <rect x="828" y="424" width="176" height="46" rx="8" fill="#17191A" stroke="#2B2E31"/>
    <text class="m s" x="844" y="444" fill="#F7F8F8">/confirm</text>
    <text class="t s" x="844" y="461" fill="#9B9FA4">done</text>

    <path d="M220 447 L238 447" stroke="#7BD40A" stroke-width="2" marker-end="url(#s-lime)"/>
    <path d="M416 447 L434 447" stroke="#7BD40A" stroke-width="2" marker-end="url(#s-lime)"/>
    <path d="M612 447 L630 447" stroke="#7BD40A" stroke-width="2" marker-end="url(#s-lime)"/>
    <path d="M808 447 L826 447" stroke="#7BD40A" stroke-width="2" marker-end="url(#s-lime)"/>
  </g>

  <rect x="44" y="490" width="380" height="112" rx="10" fill="#0F1A0B" stroke="#3D5C1F"/>
  <text class="t h" x="64" y="514" fill="#F7F8F8">Step gains a route</text>
  <text class="m s" x="64" y="536" fill="#93A87A">route: { pathname, match }</text>
  <text class="t s" x="64" y="558" fill="#9B9FA4">Discovery records where each step lived.</text>
  <text class="t s" x="64" y="576" fill="#9B9FA4">A route that no longer resolves becomes</text>
  <text class="m s" x="64" y="594" fill="#F0BF6B">ROUTE_CHANGED</text>
  <text class="t s" x="152" y="594" fill="#9B9FA4">drift.</text>

  <rect x="440" y="490" width="380" height="112" rx="10" fill="#0F1A0B" stroke="#3D5C1F"/>
  <text class="t h" x="460" y="514" fill="#F7F8F8">Runner becomes resumable</text>
  <text class="m s" x="460" y="536" fill="#93A87A">runId · stepIndex · params</text>
  <text class="t s" x="460" y="558" fill="#9B9FA4">Run state lives outside the page. Each</text>
  <text class="t s" x="460" y="576" fill="#9B9FA4">load asks: is there a run whose next</text>
  <text class="t s" x="460" y="594" fill="#9B9FA4">step matches this route?</text>

  <rect x="836" y="490" width="380" height="112" rx="10" fill="#2A2113" stroke="#6B5426"/>
  <text class="t h" x="856" y="514" fill="#F0BF6B">Gate moves per step</text>
  <text class="m s" x="856" y="536" fill="#C9A468">sideEffect: none | rev | irrev</text>
  <text class="t s" x="856" y="558" fill="#C9A468">One approval at the end is wrong once a</text>
  <text class="t s" x="856" y="576" fill="#C9A468">flow spans pages. It stops at every</text>
  <text class="t s" x="856" y="594" fill="#C9A468">irreversible boundary instead.</text>

  <!-- ================= MULTI-FLOW ================= -->
  <text class="t cap" x="44" y="654" fill="#6B7075">MANY FLOWS, MANY SITES</text>

  <rect x="44" y="670" width="576" height="112" rx="10" fill="#111213" stroke="#232527"/>
  <text class="t h" x="64" y="694" fill="#F7F8F8">Flows are keyed by origin</text>
  <text class="m s" x="64" y="716" fill="#9B9FA4">clinic.example  ->  book_appointment, cancel_appointment</text>
  <text class="m s" x="64" y="734" fill="#9B9FA4">rail.example    ->  buy_ticket, check_refund</text>
  <text class="t s" x="64" y="758" fill="#5F646A">Tools register per document, so two sites can both own a "book" tool</text>
  <text class="t s" x="64" y="774" fill="#5F646A">without colliding. Within one origin, names are uniqued already.</text>

  <rect x="640" y="670" width="576" height="112" rx="10" fill="#111213" stroke="#232527"/>
  <text class="t h" x="660" y="694" fill="#F7F8F8">Already handles this</text>
  <text class="t s" x="660" y="716" fill="#9B9FA4">Unique tool names, per-flow schemas, per-flow drift and health,</text>
  <text class="t s" x="660" y="734" fill="#9B9FA4">independent healing, run history per flow.</text>
  <text class="t s" x="660" y="758" fill="#5F646A">What is missing is only the origin field and grouping in the library.</text>
  <text class="t s" x="660" y="774" fill="#5F646A">The engine did not need to change to scale here.</text>
</svg>
